services:
  nginx:
    image: nginx:1.31.0-alpine-otel
    container_name: dast_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - frontend
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dast_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dast_user}:${POSTGRES_PASSWORD:-dast_password}@postgres:5432/${POSTGRES_DB:-dast_wrapper}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ZAP_API_URL: http://zap:8080
      RUN_MIGRATIONS: "true"
    expose:
      - "8000"
    volumes:
      - ./configs:/app/configs
      - ./reports:/app/reports
      - playwright_state:/browser-state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend
      - backend
      - scanner
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dast_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dast_user}:${POSTGRES_PASSWORD:-dast_password}@postgres:5432/${POSTGRES_DB:-dast_wrapper}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ZAP_API_URL: http://zap:8080
      WORKER_CONCURRENCY: 1
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "scan,replay,validation,report",
        "--concurrency=${WORKER_CONCURRENCY:-2}"
      ]
    volumes:
      - ./configs:/app/configs
      - ./reports:/app/reports
      - playwright_state:/browser-state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zap:
        condition: service_healthy
      playwright:
        condition: service_healthy
    networks:
      - backend
      - scanner
      - egress
    mem_limit: 1536m
    cpus: 1.50
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$(hostname) --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: dast_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dast_wrapper}
      POSTGRES_USER: ${POSTGRES_USER:-dast_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dast_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dast_user} -d ${POSTGRES_DB:-dast_wrapper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: dast_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  zap:
    build:
      context: .
      dockerfile: docker/zap/Dockerfile
    container_name: dast_zap
    restart: unless-stopped
    environment:
      ZAP_JAVA_OPTS: ${ZAP_JAVA_OPTS:--Xms512m -Xmx1536m}
    volumes:
      - zap_data:/zap/wrk
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - scanner
      - egress
    mem_limit: 4096m
    cpus: 2.00
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true

  playwright:
    build:
      context: .
      dockerfile: docker/playwright/Dockerfile
    container_name: dast_playwright
    restart: unless-stopped
    volumes:
      - playwright_state:/browser-state
    expose:
      - "9333"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 9333), 3); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scanner
      - egress
    mem_limit: 1024m
    cpus: 1.00
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    shm_size: 512m

networks:
  frontend:
  backend:
    internal: true
  scanner:
    internal: true
  egress:

volumes:
  postgres_data:
  redis_data:
  zap_data:
  playwright_state:
  nginx_cache:
