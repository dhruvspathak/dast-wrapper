[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "dast-wrapper"
version = "0.1.0"
description = "Application Security Orchestration & Validation Platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",

    # Redis / Celery
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",

    # Validation / config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # HTTP
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "networkx>=3.4.0",

    # OpenAI
    "openai>=1.57.0",

    # Security tooling
    "playwright>=1.49.0",
    "python-owasp-zap-v2.4>=0.1.0",

    # Templates
    "jinja2>=3.1.4",

    # Utils
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",

    "black>=24.10.0",
    "isort>=5.13.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",

    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
